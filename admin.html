<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Administradora - Always Beautiful Studio</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 12px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #00bcd4;
      font-size: 24px;
    }
    .header p {
      color: #666;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background-color: #e0e0e0;
      color: #555;
      font-size: 13px;
      text-align: center;
      transition: 0.3s;
    }
    .tab-btn.active {
      background-color: #00bcd4;
      color: #fff;
    }

    .panel-section {
      display: none;
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .panel-section.active {
      display: block;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #333;
      border-bottom: 2px solid #00bcd4;
      padding-bottom: 4px;
      display: inline-block;
    }

    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
    }
    
    .btn-main {
      background-color: #00bcd4;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }

    .category-list {
      list-style: none;
      margin-top: 10px;
    }
    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .action-btns {
      display: flex;
      gap: 5px;
      width: 100%;
      margin-top: 5px;
    }
    .btn-sm {
      flex: 1;
      padding: 6px 8px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-edit { background-color: #ffb74d; color: #fff; }
    .btn-delete { background-color: #e57373; color: #fff; }

    /* Estilos Acordeón por Categoría */
    .category-accordion {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .accordion-header {
      background-color: #e0f7fa;
      color: #00838f;
      padding: 12px 15px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .accordion-header:hover {
      background-color: #b2ebf2;
    }
    .accordion-content {
      display: none;
      padding: 12px;
      background-color: #fafafa;
    }
    .accordion-content.open {
      display: block;
    }

    .grid-designs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 600px) {
      .grid-designs {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
    }

    .card-design {
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      text-align: center;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-design img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 4px;
    }
    .card-design h4 {
      font-size: 13px;
      margin: 6px 4px 2px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-design .price {
      color: #00bcd4;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>👑 Panel Administradora</h1>
    <p>Gestión completa del catálogo y la agenda</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('catalog-tab', this)">📸 Diseños</button>
    <button class="tab-btn" onclick="switchTab('agenda-tab', this)">📅 Agenda</button>
  </div>

  <div id="catalog-tab" class="panel-section active">
    
    <h2>1. Categorías del Catálogo</h2>
    <form id="form-category" onsubmit="saveCategory(event)">
      <div class="form-group">
        <label for="cat-name">Nueva Categoría:</label>
        <input type="text" id="cat-name" placeholder="Ej: Uñas Polygel, Cejas 3D..." required>
      </div>
      <button type="submit" class="btn-main">➕ Crear Categoría</button>
    </form>

    <ul class="category-list" id="category-list-container">
      <!-- Categorías Dinámicas -->
    </ul>

    <br><hr><br>

    <h2>2. Subir / Editar Diseño</h2>
    <form id="form-design" onsubmit="saveDesign(event)">
      <input type="hidden" id="edit-id" value="">
      
      <div class="form-group">
        <label for="design-title">Título del Diseño:</label>
        <input type="text" id="design-title" placeholder="Ej: Uñas Baby Boomer" required>
      </div>

      <div class="form-group">
        <label for="design-category">Categoría:</label>
        <select id="design-category" required>
          <option value="">-- Seleccionar --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="design-price">Precio ($):</label>
        <input type="number" id="design-price" placeholder="Ej: 80000" required>
      </div>

      <div class="form-group">
        <label for="design-file">Foto del Estilo:</label>
        <input type="file" id="design-file" accept="image/*">
      </div>

      <button type="submit" class="btn-main" id="btn-save-design">📤 Guardar en Catálogo</button>
    </form>

    <br><hr><br>

    <h2>3. Catálogo Organizado por Categorías</h2>
    <div id="accordion-container">
      <!-- Se generan bloques por categoría -->
    </div>

  </div>

  <div id="agenda-tab" class="panel-section">
    <h2>📅 Citas Agendadas</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Listado de citas recibidas desde la página principal.</p>
    <div id="appointments-container">
      <p style="text-align: center; color: #999; padding: 20px;">No hay citas pendientes.</p>
    </div>
  </div>

  <script>
    let categories = JSON.parse(localStorage.getItem('ab_categories')) || [
      "Uñas Acrílicas / Gel",
      "Keratinas (Antes y Después)",
      "Pestañas y Cejas"
    ];

    let designs = JSON.parse(localStorage.getItem('ab_designs')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderGroupedDesigns();
    });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.panel-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function renderCategories() {
      const container = document.getElementById('category-list-container');
      const select = document.getElementById('design-category');
      
      container.innerHTML = '';
      select.innerHTML = '<option value="">-- Seleccionar --</option>';

      categories.forEach((cat, index) => {
        container.innerHTML += `
          <li class="category-item">
            <span>${cat}</span>
            <div style="display: flex; gap: 5px;">
              <button class="btn-sm btn-edit" style="width: auto;" onclick="editCategory(${index})">✏️ Editar</button>
              <button class="btn-sm btn-delete" style="width: auto;" onclick="deleteCategory(${index})">🗑️</button>
            </div>
          </li>
        `;

        select.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      localStorage.setItem('ab_categories', JSON.stringify(categories));
    }

    function saveCategory(e) {
      e.preventDefault();
      const input = document.getElementById('cat-name');
      const name = input.value.trim();
      
      if (name) {
        categories.push(name);
        renderCategories();
        renderGroupedDesigns();
        input.value = '';
      }
    }

    function editCategory(index) {
      const newName = prompt("Editar nombre de la categoría:", categories[index]);
      if (newName && newName.trim() !== "") {
        const oldName = categories[index];
        categories[index] = newName.trim();
        
        // Actualizar la categoría en los diseños existentes
        designs.forEach(d => {
          if (d.category === oldName) d.category = newName.trim();
        });

        renderCategories();
        renderGroupedDesigns();
      }
    }

    function deleteCategory(index) {
      if (confirm(`¿Eliminar la categoría "${categories[index]}"?`)) {
        categories.splice(index, 1);
        renderCategories();
        renderGroupedDesigns();
      }
    }

    function toggleAccordion(id) {
      const content = document.getElementById(id);
      content.classList.toggle('open');
    }

    function renderGroupedDesigns() {
      const container = document.getElementById('accordion-container');
      container.innerHTML = '';

      if (categories.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No hay categorías creadas.</p>';
        return;
      }

      categories.forEach((cat, catIndex) => {
        // Filtrar diseños de esta categoría
        const catDesigns = designs.filter(d => d.category === cat);
        const accordionId = `acc-${catIndex}`;

        let designsHTML = '';
        if (catDesigns.length === 0) {
          designsHTML = '<p style="color: #999; font-size: 13px; text-align: center; padding: 10px;">Sin fotos subidas en esta categoría.</p>';
        } else {
          designsHTML = '<div class="grid-designs">';
          designs.forEach((d, globalIndex) => {
            if (d.category === cat) {
              designsHTML += `
                <div class="card-design">
                  <img src="${d.image}" alt="${d.title}">
                  <h4>${d.title}</h4>
                  <div class="price">$${Number(d.price).toLocaleString('es-CO')}</div>
                  <div class="action-btns">
                    <button class="btn-sm btn-edit" onclick="editDesign(${globalIndex})">✏️ Editar</button>
                    <button class="btn-sm btn-delete" onclick="deleteDesign(${globalIndex})">🗑️ Eliminar</button>
                  </div>
                </div>
              `;
            }
          });
          designsHTML += '</div>';
        }

        container.innerHTML += `
          <div class="category-accordion">
            <div class="accordion-header" onclick="toggleAccordion('${accordionId}')">
              <span>📁 ${cat} (${catDesigns.length} fotos)</span>
              <span>▼</span>
            </div>
            <div class="accordion-content open" id="${accordionId}">
              ${designsHTML}
            </div>
          </div>
        `;
      });

      try {
        localStorage.setItem('ab_designs', JSON.stringify(designs));
      } catch (e) {
        alert("Atención: El almacenamiento de imágenes está lleno. Borra algunos diseños anteriores.");
      }
    }

    // Función que comprime la imagen para que suba sin saturar el almacenamiento
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const max_size = 500;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > max_size) {
              height *= max_size / width;
              width = max_size;
            }
          } else {
            if (height > max_size) {
              width *= max_size / height;
              height = max_size;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveDesign(e) {
      e.preventDefault();

      const editId = document.getElementById('edit-id').value;
      const title = document.getElementById('design-title').value.trim();
      const category = document.getElementById('design-category').value;
      const price = document.getElementById('design-price').value;
      const fileInput = document.getElementById('design-file');

      const processSave = (imageUrl) => {
        if (editId !== "") {
          designs[editId] = {
            title,
            category,
            price,
            image: imageUrl || designs[editId].image
          };
          document.getElementById('edit-id').value = "";
          document.getElementById('btn-save-design').innerText = "📤 Guardar en Catálogo";
        } else {
          if (!imageUrl) {
            alert("Por favor selecciona una foto para el diseño.");
            return;
          }
          designs.push({ title, category, price, image: imageUrl });
        }

        renderGroupedDesigns();
        document.getElementById('form-design').reset();
      };

      if (fileInput.files && fileInput.files[0]) {
        compressImage(fileInput.files[0], function(compressedUrl) {
          processSave(compressedUrl);
        });
      } else {
        processSave(null);
      }
    }

    function editDesign(index) {
      const d = designs[index];
      document.getElementById('edit-id').value = index;
      document.getElementById('design-title').value = d.title;
      document.getElementById('design-category').value = d.category;
      document.getElementById('design-price').value = d.price;
      document.getElementById('btn-save-design').innerText = "🔄 Actualizar Diseño";
      
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function deleteDesign(index) {
      if (confirm(`¿Eliminar el diseño "${designs[index].title}"?`)) {
        designs.splice(index, 1);
        renderGroupedDesigns();
      }
    }
  </script>
</body>
</html>
