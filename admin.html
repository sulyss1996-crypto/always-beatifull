<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Always Beautiful</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Script de Seguridad (Contraseña) -->
  <script>
    const CLAVE_SECRETA = "Suly2026"; // Puedes cambiar esta contraseña cuando gustes
    const ingreso = prompt("🔒 Panel Privado - Always Beautiful\nIngresa la contraseña de administración:");
    if (ingreso !== CLAVE_SECRETA) {
      alert("❌ Contraseña incorrecta. Acceso denegado.");
      window.location.href = "index.html";
    }
  </script>
</head>
<body>

  <header class="main-header admin-header">
    <div class="logo-container">
      <img src="logo.png" alt="Always Beautiful Logo" class="brand-logo">
    </div>
    <h1>👑 Panel Administradora - Always Beautiful</h1>
    <p>Gestión de Catálogo, Citas Agendadas y Recordatorios</p>
  </header>

  <main class="container admin-container">
    
    <!-- Sección 1: Subir Servicio al Catálogo -->
    <section class="admin-card">
      <h2>📸 Agregar Nuevo Trabajo al Catálogo</h2>
      <form id="form-nuevo-servicio">
        <div class="form-group">
          <label for="tituloServicio">Título o Nombre del Diseño / Trabajo</label>
          <input type="text" id="tituloServicio" placeholder="Ej: Uñas Acrílicas con Gemas" required>
        </div>

        <div class="form-group">
          <label for="categoriaServicio">Categoría</label>
          <select id="categoriaServicio" required>
            <option value="Uñas Acrílicas / Gel">Uñas Acrílicas / Gel</option>
            <option value="Keratinas (Antes y Después)">Keratinas (Antes y Después)</option>
            <option value="Pestañas y Cejas">Pestañas y Cejas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precioServicio">Precio Estimado (COP)</label>
          <input type="number" id="precioServicio" placeholder="Ej: 50000" required>
        </div>

        <div class="form-group">
          <label for="urlImagen">URL de la Foto / Imagen</label>
          <input type="url" id="urlImagen" placeholder="https://..." required>
        </div>

        <button type="submit" class="btn-success">➕ Publicar en Catálogo</button>
      </form>
    </section>

    <!-- Sección 2: Citas Agendadas en Tiempo Real -->
    <section class="admin-card">
      <h2>📅 Citas Agendadas por Clientas</h2>
      <div class="filter-group">
        <label for="filtroFechaAdmin">Filtrar Citas por Fecha:</label>
        <input type="date" id="filtroFechaAdmin">
      </div>

      <div id="lista-citas-admin" class="citas-list">
        <!-- Las citas se cargarán en vivo desde Firebase -->
      </div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
